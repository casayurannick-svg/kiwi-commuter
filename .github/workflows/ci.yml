name: CI & E2E Regression Suite

on:
  push:
    branches: [ main, 'test/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan full history
        run: gitleaks git --redact -v

  ci-test:
    name: Unit & E2E Regression Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Test Suite
        run: npx vitest run

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Regression Tests
        run: npx playwright test --project="Mobile Chrome (375px)"
        env:
          CI: true
