name: Refresh MBIE Fuel Prices

on:
  schedule:
    # Runs every Monday at 19:00 UTC (07:00 or 08:00 NZST Tuesday morning)
    - cron: '0 19 * * 0'
  workflow_dispatch:

jobs:
  refresh-fuel:
    name: Fetch MBIE Fuel & Sync to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run MBIE Fuel Price Fetcher
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/fetch-mbie-fuel.ts
